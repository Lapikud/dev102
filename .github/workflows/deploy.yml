name: Build & Deploy
on:
  push: { branches: [main] }
  pull_request:

jobs:
  validate:                      # GitHub-hosted — the PR safety gate
    runs-on: ubuntu-latest
    name: Test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test           # run the repo's test suite
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/

  deploy:                        # Push to lapikud lxc, main branch only
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, dev102]
    steps:
      - uses: actions/checkout@v4          # just for package.json + lockfile
      - uses: actions/download-artifact@v4
        with: { name: site, path: dist/ }
      - run: pnpm install --prod --frozen-lockfile
      - run: sudo systemctl restart dev102.service